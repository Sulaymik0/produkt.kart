<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="catalog">
     <div class="container catalog_container">
      <h1 class="title catalog_title">Выбери свой продукт</h1>
       <button id="change-Color-all-card">Cменить цвет всех карточек</button>
       <button id="change-Color-first-card">Cменить цвет первой карточки</button>
       <button id="open-google">Открыть страницу Google.com</button>
       <button id="output-console-log">Вывести собщение в консоль лог</button>
    <ul class="bosslist"></ul>
      <template id="card-template">
  <li class="card">
    <img class="card_image" src="" alt="">

    <span class="info_category"></span>

    <h2 class="subtitle_name"></h2>

    <p class="card_description"></p>

    <div class="card_compound compound">
    </div>

    <span class="compound_consist">Состав:</span>

    <ul class="substances">

    </ul>

    <div class="price_wrapper">
      <b class="card_price">Цена</b>
      <span class="money"></span>
    </div>
  </li>
</template>
</main>
<script type="module" src="./homework-10.js"></script>
</body>
</html>
